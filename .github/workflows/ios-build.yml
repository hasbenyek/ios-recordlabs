name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-simulator:
    name: Build (iOS Simulator, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project RecordLabsiOS.xcodeproj \
            -scheme RecordLabsiOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Inspect Xcode and simulator destinations
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcodebuild -showdestinations \
            -project RecordLabsiOS.xcodeproj \
            -scheme RecordLabsiOS

      - name: Boot first available iPhone simulator
        id: simulator
        run: |
          XCODE_DESTINATIONS=$(xcodebuild -showdestinations \
            -project RecordLabsiOS.xcodeproj \
            -scheme RecordLabsiOS)

          DEVICE_INFO=$(xcrun simctl list devices available | perl -ne '
            if (/^-- (.+?) --$/) { $runtime = $1; next; }
            if (/^\s*(iPhone[^()]*)\s+\(([0-9A-Fa-f-]{36})\)\s+\((Booted|Shutdown)\)/) {
              print "$1|$2|$3|$runtime\n";
            }
          ')

          SIMULATOR_NAME=''
          SIMULATOR_ID=''
          SIMULATOR_STATE=''
          SIMULATOR_RUNTIME=''
          while IFS='|' read -r CANDIDATE_NAME CANDIDATE_ID CANDIDATE_STATE CANDIDATE_RUNTIME; do
            if echo "$XCODE_DESTINATIONS" | grep -Fq "$CANDIDATE_ID"; then
              SIMULATOR_NAME="$CANDIDATE_NAME"
              SIMULATOR_ID="$CANDIDATE_ID"
              SIMULATOR_STATE="$CANDIDATE_STATE"
              SIMULATOR_RUNTIME="$CANDIDATE_RUNTIME"
              break
            fi
          done <<< "$DEVICE_INFO"

          SIMULATOR_NAME=$(echo "$SIMULATOR_NAME" | sed 's/[[:space:]]*$//')
          test -n "$SIMULATOR_ID"
          test -n "$SIMULATOR_RUNTIME"

          echo "Selected simulator: $SIMULATOR_NAME"
          echo "Selected runtime: $SIMULATOR_RUNTIME"
          echo "Selected UDID: $SIMULATOR_ID"

          if [ "$SIMULATOR_STATE" != "Booted" ]; then
            xcrun simctl boot "$SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          echo "udid=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          echo "name=$SIMULATOR_NAME" >> "$GITHUB_OUTPUT"
          echo "runtime=$SIMULATOR_RUNTIME" >> "$GITHUB_OUTPUT"

      - name: Run XCTest suite
        run: |
          xcodebuild test \
            -project RecordLabsiOS.xcodeproj \
            -scheme RecordLabsiOS \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -destination-timeout 180 \
            CODE_SIGNING_ALLOWED=NO

  # ---------------------------------------------------------------------
  # The `secrets` context isn't allowed directly in a job-level `if:`
  # (GitHub only permits `github, needs, vars, inputs` there — using
  # `secrets` fails workflow validation with "Unrecognized named-value:
  # 'secrets'" before any job even runs). So the presence check happens in
  # its own cheap step (`run:` *does* allow `secrets`), and archive-ipa's
  # `if:` reads that job's output via `needs` instead.
  # ---------------------------------------------------------------------
  check-signing-secret:
    name: Check if signing secrets are configured
    runs-on: ubuntu-latest
    outputs:
      has-team-id: ${{ steps.check.outputs.has-team-id }}
    steps:
      - id: check
        run: echo "has-team-id=${{ secrets.IOS_TEAM_ID != '' }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Archive + export a real, installable .ipa. Only runs once you've added
  # your own Apple Developer signing secrets to this repo's
  # Settings → Secrets and variables → Actions. Nobody else can create these
  # for you — they come from your developer.apple.com account:
  #   IOS_DIST_CERTIFICATE_P12_BASE64  – distribution cert, base64-encoded
  #   IOS_DIST_CERTIFICATE_PASSWORD    – that .p12's password
  #   IOS_PROVISIONING_PROFILE_BASE64  – matching provisioning profile, base64
  #   IOS_TEAM_ID                      – your 10-character Apple Team ID
  # See "README.md" → "Producing a signed .ipa via CI" for the exact steps
  # to generate and encode these. Without them, this job is skipped and
  # only the unsigned simulator build above runs.
  # ---------------------------------------------------------------------
  archive-ipa:
    name: Archive & export signed .ipa
    runs-on: macos-latest
    needs: [build-simulator, check-signing-secret]
    if: needs.check-signing-secret.outputs.has-team-id == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate & provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project RecordLabsiOS.xcodeproj \
            -scheme RecordLabsiOS \
            -archivePath $RUNNER_TEMP/RecordLabsiOS.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual

      - name: Export .ipa
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/RecordLabsiOS.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: RecordLabsiOS-ipa
          path: ${{ runner.temp }}/export/*.ipa
