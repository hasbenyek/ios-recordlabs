name: RecordLabsiOS
options:
  bundleIdPrefix: com.recordlabs.music.ios
  deploymentTarget:
    iOS: "15.0"
configs:
  Debug: debug
  Release: release
targets:
  RecordLabsiOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: RecordLabsiOS
        excludes:
          - "Info.plist"
          - "LaunchScreen.storyboard"
      - path: RecordLabsiOS/LaunchScreen.storyboard
        buildPhase: resources
    info:
      path: RecordLabsiOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recordlabs.music.ios
        PRODUCT_NAME: "Record Labs"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchStoryboardName: "LaunchScreen"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # No signing team is set here on purpose — this repo has none to
        # commit. Building for the Simulator needs no signing at all. To
        # build for/archive to a real device or export a .ipa, set your own
        # team either in Xcode (Signing & Capabilities) after opening the
        # generated project, or via CODE_SIGN_STYLE/DEVELOPMENT_TEAM
        # overrides in CI (see .github/workflows/ios-build.yml).
        CODE_SIGN_STYLE: Automatic
  RecordLabsiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: RecordLabsiOSTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: RecordLabsiOS
schemes:
  RecordLabsiOS:
    build:
      targets:
        RecordLabsiOS: all
        RecordLabsiOSTests: [test]
    test:
      config: Debug
      targets:
        - RecordLabsiOSTests
    run:
      config: Debug
    archive:
      config: Release
