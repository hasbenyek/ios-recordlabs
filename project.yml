name: RecordLabsiOS
options:
  bundleIdPrefix: com.recordlabs.music.ios
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  RecordLabsiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RecordLabsiOS
        excludes:
          - "Info.plist"
    info:
      path: RecordLabsiOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recordlabs.music.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # No signing team is set here on purpose — this repo has none to
        # commit. Building for the Simulator needs no signing at all. To
        # build for/archive to a real device or export a .ipa, set your own
        # team either in Xcode (Signing & Capabilities) after opening the
        # generated project, or via CODE_SIGN_STYLE/DEVELOPMENT_TEAM
        # overrides in CI (see .github/workflows/ios-build.yml).
        CODE_SIGN_STYLE: Automatic
